name: Deploy DMARC Dashboard

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'function/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_RESOURCE_GROUP: rg-dmarc
  NAME_PREFIX: dmarc
  BICEP_FILE: infra/main.bicep
  FUNCTION_PATH: function

jobs:
  deploy:
    name: Deploy infra + function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ${{ env.BICEP_FILE }}
          parameters: >-
            namePrefix=${{ env.NAME_PREFIX }}
            entraClientId=${{ secrets.ENTRA_CLIENT_ID }}
          failOnStdErr: false

      - name: Show Bicep outputs
        run: |
          echo "Function App:  ${{ steps.bicep.outputs.functionAppName }}"
          echo "Dashboard URL: ${{ steps.bicep.outputs.dashboardUrl }}"

      - name: Setup Node.js (for Functions Core Tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish Function App
        working-directory: ${{ env.FUNCTION_PATH }}
        run: |
          func azure functionapp publish ${{ steps.bicep.outputs.functionAppName }} --powershell

      - name: Install Az modules on server via Kudu
        shell: pwsh
        run: |
          $funcName = "${{ steps.bicep.outputs.functionAppName }}"
          $rg = "${{ env.AZURE_RESOURCE_GROUP }}"
          
          # Wait for SCM site to be ready after publish
          Write-Host "Waiting 30s for SCM site..."
          Start-Sleep 30
          
          $creds = az webapp deployment list-publishing-profiles -g $rg -n $funcName `
            --query "[?publishMethod=='MSDeploy'] | [0]" | ConvertFrom-Json
          $pair = "$($creds.userName):$($creds.userPWD)"
          $auth = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
          $headers = @{ Authorization = $auth; 'Content-Type' = 'application/json' }
          
          Write-Host "Installing Az.Accounts..."
          $cmd1 = @{ command = 'powershell -c "Save-Module Az.Accounts -Path D:\home\site\wwwroot\Modules -Force -Repository PSGallery; Write-Output DONE"'; dir = '.' } | ConvertTo-Json
          $r1 = Invoke-RestMethod -Uri "https://$funcName.scm.azurewebsites.net/api/command" -Method Post -Headers $headers -Body $cmd1
          Write-Host "Az.Accounts: $($r1.Output)"
          if ($r1.Error) { Write-Warning "Az.Accounts errors: $($r1.Error)" }
          
          Write-Host "Installing Az.Storage..."
          $cmd2 = @{ command = 'powershell -c "Save-Module Az.Storage -Path D:\home\site\wwwroot\Modules -Force -Repository PSGallery; Write-Output DONE"'; dir = '.' } | ConvertTo-Json
          $r2 = Invoke-RestMethod -Uri "https://$funcName.scm.azurewebsites.net/api/command" -Method Post -Headers $headers -Body $cmd2
          Write-Host "Az.Storage: $($r2.Output)"
          if ($r2.Error) { Write-Warning "Az.Storage errors: $($r2.Error)" }
          
          Write-Host "Restarting Function App..."
          az functionapp restart -g $rg -n $funcName
          Write-Host "Done."

      - name: Summary
        run: |
          echo "### :rocket: Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: ${{ steps.bicep.outputs.dashboardUrl }}" >> $GITHUB_STEP_SUMMARY
